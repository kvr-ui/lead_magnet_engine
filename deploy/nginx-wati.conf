# /etc/nginx/sites-available/wati  (symlink into sites-enabled)
# Replace wati.example.com with your domain (or use the server's IP + default_server).

server {
    listen 80;
    server_name wati.example.com;

    # allow the 50 MB uploads the app accepts
    client_max_body_size 51m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
